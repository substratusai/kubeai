name: Dependabot auto-merge

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read
  pull-requests: read

jobs:
  automerge:
    if: >-
      github.repository == 'kubeai-project/kubeai' &&
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.base.ref == 'main' &&
      !github.event.pull_request.draft &&
      vars.DEPENDABOT_AUTOMERGE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate repository-scoped app token
        if: >-
          (steps.meta.outputs.update-type == 'version-update:semver-patch' ||
          steps.meta.outputs.update-type == 'version-update:semver-minor') &&
          !contains(steps.meta.outputs.dependency-names, 'k8s.io/')
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510
        with:
          client-id: ${{ vars.AUTOMERGE_APP_CLIENT_ID }}
          private-key: ${{ secrets.AUTOMERGE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write

      - name: Verify protections and enable auto-merge
        if: >-
          (steps.meta.outputs.update-type == 'version-update:semver-patch' ||
          steps.meta.outputs.update-type == 'version-update:semver-minor') &&
          !contains(steps.meta.outputs.dependency-names, 'k8s.io/')
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY" --jq '.allow_auto_merge' | grep -qx true
          rules=$(gh api "repos/$GITHUB_REPOSITORY/rules/branches/main")
          jq -e '
            [.[] | select(.type == "required_status_checks") | .parameters] as $policies |
            any($policies[]; .strict_required_status_checks_policy == true) and
            ([ $policies[].required_status_checks[].context ] as $checks |
              all(["required-tests", "lint-test", "security-checks"][];
                . as $required | $checks | index($required) != null))
          ' <<< "$rules"
          gh pr review --approve "$PR_URL"
          gh pr merge --auto --squash --match-head-commit "$HEAD_SHA" "$PR_URL"
