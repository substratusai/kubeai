version: 2
updates:
  - package-ecosystem: gomod
    directories: ["/", "/examples/private-deep-chat"]
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
      semver-major-days: 14
    groups:
      k8s:
        patterns: ["k8s.io/*", "sigs.k8s.io/*"]
      otel:
        patterns: ["go.opentelemetry.io/*"]
      go-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directories:
      - "/"
      - "/components/model-loader"
      - "/components/llmman-loader"
      - "/examples/ollama-builtin"
      - "/examples/private-deep-chat"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      docker:
        patterns: ["*"]

  - package-ecosystem: helm
    directories: ["/charts/kubeai", "/charts/models"]
    schedule:
      interval: weekly
    cooldown:
      default-days: 7

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions-all:
        patterns: ["*"]

  - package-ecosystem: pip
    directories:
      - "/docs"
      - "/test/e2e/openai-python-client"
      - "/examples/k8s-api-clients/python"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
